<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00856f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17322d}
.app{max-width:430px;margin:auto;min-height:100vh;background:#f8fbfa}
header{background:linear-gradient(135deg,#075e52,#00856f);color:white;padding:24px 20px 20px;border-radius:0 0 24px 24px}
.brand{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.85;margin-top:3px}
.balance{margin-top:18px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);padding:17px;border-radius:18px}
.balance small{opacity:.85}.balance strong{display:block;font-size:30px;margin-top:5px}
main{padding:16px 16px 90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-4px}
.card{background:white;border-radius:16px;padding:15px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.label{font-size:12px;color:#6b7d78}.value{font-size:19px;font-weight:800;margin-top:6px}
.green{color:#00856f}.red{color:#dc4b4b}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h3{margin:0;font-size:17px}.section button{border:0;background:none;color:#00856f;font-weight:700}
.item{display:flex;align-items:center;gap:12px;background:white;padding:13px;border-radius:15px;margin-bottom:9px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#e9f7f3;font-size:20px}.item b{font-size:14px}.item small{display:block;color:#75847f;margin-top:3px}.right{margin-left:auto;text-align:right}.right b{font-size:14px}.tag{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:8px;font-size:10px;background:#fff0d9;color:#c47700}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;background:white;border-top:1px solid #e5ece9;padding:10px 4px 12px;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
nav button{border:0;background:none;color:#83928e;font-size:11px}.active{color:#00856f!important;font-weight:800}
.fab{position:fixed;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:76px;width:54px;height:54px;border:0;border-radius:50%;background:#00856f;color:white;font-size:28px;box-shadow:0 8px 18px rgba(0,133,111,.3)}

.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report-box{background:white;border-radius:15px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.report-box small{display:block;color:#74837f;font-size:11px}.report-box strong{display:block;font-size:18px;margin-top:5px}
.bar{height:10px;background:#e7efec;border-radius:10px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#00856f;border-radius:10px;width:50%}
.empty{padding:16px;text-align:center;color:#71817c;font-size:13px;background:white;border-radius:14px}

</head>
<body>
<div class="app">
<header>
  <div class="brand">💼 Meu Financeiro</div>
  <div class="sub">Seu dinheiro, no seu controle!</div>
  <div class="balance"><small>Saldo atual</small><strong>R$ 1.200,00</strong></div>
</header>
<main>
  <div class="grid">
    <div class="card"><div class="label">↑ Entradas do mês</div><div id="totalEntradas" class="value green" data-base="5800">R$ 5.800,00</div></div>
    <div class="card"><div class="label">↓ Despesas do mês</div><div id="totalDespesas" class="value red" data-base="3420">R$ 3.420,00</div></div>
  </div>

  <div class="section"><h3>Contas a pagar</h3><button>Ver todas</button></div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="label">Este mês</div><div id="totalContas" class="value">R$ 1.180,00</div></div><div style="font-size:24px">🧾</div>
  </div>

  <div class="section"><h3>Próximos vencimentos</h3><button>Ver todos</button></div>
  <div class="item"><div class="icon">⚡</div><div><b>Energia Elétrica</b><small>10/09/2026</small></div><div class="right"><b>R$ 187,50</b><span class="tag">3 dias</span></div></div>
  <div class="item"><div class="icon">📶</div><div><b>Internet</b><small>12/09/2026</small></div><div class="right"><b>R$ 99,90</b><span class="tag">5 dias</span></div></div>
  <div class="item"><div class="icon">💧</div><div><b>Água</b><small>15/09/2026</small></div><div class="right"><b>R$ 85,00</b><span class="tag">8 dias</span></div></div>





  <div class="section"><h3>💳 Cartão de crédito</h3><button onclick="toggleCardForm()">+ Compra</button></div>
  <div class="credit-summary">
    <div class="credit-box"><small>Limite</small><b id="creditLimit">R$ 3.000,00</b></div>
    <div class="credit-box"><small>Fatura atual</small><b id="creditBill">R$ 0,00</b></div>
  </div>
  <div class="card-form" id="cardForm">
    <label>Compra</label>
    <input id="purchaseName" type="text" placeholder="Ex.: Mercado">
    <label>Valor total</label>
    <input id="purchaseValue" type="number" step="0.01" placeholder="0,00">
    <label>Parcelas</label>
    <select id="purchaseInstallments">
      <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option>
      <option value="6">6x</option><option value="10">10x</option><option value="12">12x</option>
    </select>
    <label>Vencimento da fatura</label>
    <input id="cardDue" type="number" min="1" max="31" placeholder="10">
    <button onclick="addPurchase()">Salvar compra</button>
  </div>
  <div id="purchasesList"></div>

  <div class="section"><h3>💰 Movimentações</h3><button onclick="toggleTxForm()">+ Lançamento</button></div>
  <div id="txForm" class="transaction-form">
    <label>Tipo</label>
    <select id="txType"><option value="in">Entrada</option><option value="out">Despesa</option></select>
    <label>Descrição</label>
    <input id="txName" type="text" placeholder="Ex.: Salário ou supermercado">
    <label>Categoria</label>
    <select id="txCategory">
      <option>Salário</option><option>Alimentação</option><option>Mercado</option><option>Combustível</option><option>Casa</option><option>Lazer</option><option>Outros</option>
    </select>
    <label>Data</label>
    <input id="txDate" type="date">
    <label>Valor</label>
    <input id="txValue" type="number" step="0.01" placeholder="0,00">
    <button onclick="addTransaction()">Salvar lançamento</button>
  </div>
  <div id="transactionsList"></div>

  <div class="section"><h3>🧾 Contas mensais</h3><button onclick="toggleBillForm()">+ Nova conta</button></div>
  <div id="billForm" class="bill-form">
    <label>Nome da conta</label>
    <input id="billName" type="text" placeholder="Ex.: Energia Elétrica">
    <label>Valor</label>
    <input id="billValue" type="number" step="0.01" placeholder="0,00">
    <label>Dia do vencimento</label>
    <input id="billDue" type="number" min="1" max="31" placeholder="10">
    <label>Repetir todos os meses?</label>
    <select id="billRecurring"><option value="yes">Sim</option><option value="no">Não</option></select>
    <button onclick="addBill()">Salvar conta</button>
  </div>
  <div id="billsList">
    <div class="bill-row" data-bill-value="187.50" data-bill-status="pending">
      <div class="icon">⚡</div>
      <div><b>Energia Elétrica</b><div class="bill-date">Vencimento: dia 10 · Mensal</div></div>
      <div class="bill-value">R$ 187,50<br><button class="bill-status bill-pending" onclick="toggleBillStatus(this)">Pendente</button></div>
    </div>
    <div class="bill-row" data-bill-value="99.90" data-bill-status="paid">
      <div class="icon">📶</div>
      <div><b>Internet</b><div class="bill-date">Vencimento: dia 12 · Mensal</div></div>
      <div class="bill-value">R$ 99,90<br><button class="bill-status bill-paid" onclick="toggleBillStatus(this)">Paga</button></div>
    </div>
  </div>

  <div class="section"><h3>📅 Eventos</h3><button onclick="toggleEventForm()">+ Novo evento</button></div>
  <div id="eventForm" class="event-form">
    <label>Nome do evento</label>
    <input id="eventName" type="text" placeholder="Ex.: Festa de aniversário">
    <label>Local</label>
    <input id="eventLocation" type="text" placeholder="Ex.: Salão da família">
    <label>Data</label>
    <input id="eventDate" type="date">
    <label>Valor</label>
    <input id="eventValue" type="number" step="0.01" placeholder="0,00">
    <label>Status do pagamento</label>
    <select id="eventStatus" style="width:100%;padding:11px;border:1px solid #dbe6e2;border-radius:10px;font-size:14px;background:white">
      <option value="pending">Ainda para receber</option>
      <option value="paid">Pago/Recebido</option>
    </select>
    <button onclick="addEvent()">Salvar evento</button>
  </div>
  <div id="eventsList">
    <div class="event-row">
      <div class="icon">🎉</div>
      <div><b>Aniversário</b><div class="event-date">📍 Salão da família · 20/09/2026</div></div>
      <div class="event-value">R$ 300,00<br><button class="status-btn status-pending" onclick="toggleStatus(this)">A receber</button></div>
    </div>
  </div>

  <div class="section"><h3>Resumo rápido</h3></div>
  <div class="card"><div class="label">Disponível depois das contas</div><div id="saldoPrevisto" class="value green">R$ 20,00</div></div>
</main>
<button class="fab" onclick="alert('Aqui vamos adicionar uma entrada, despesa ou conta.')">+</button>
<nav>
  <button class="active">⌂<br>Início</button>
  <button>↑<br>Entradas</button>
  <button>↓<br>Despesas</button>
  <button>▣<br>Contas</button>
  <button onclick="document.getElementById('eventForm').style.display='block'">📅<br>Eventos</button>
  <button>☰<br>Mais</button>
</nav>
</div>

<script>



const creditLimitValue=3000;
function toggleCardForm(){
  const f=document.getElementById('cardForm');
  f.style.display=f.style.display==='block'?'none':'block';
}
function addPurchase(){
  const name=document.getElementById('purchaseName').value.trim();
  const total=parseFloat(document.getElementById('purchaseValue').value||0);
  const installments=parseInt(document.getElementById('purchaseInstallments').value);
  const due=document.getElementById('cardDue').value;
  if(!name||!total||!due){alert('Preencha compra, valor e vencimento.');return;}
  const installment=total/installments;
  const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const row=document.createElement('div');
  row.className='purchase-row'; row.dataset.purchaseValue=installment;
  row.innerHTML=`<div class="icon">💳</div><div><b>${name}</b><div class="purchase-date">${installments}x de ${money(installment)} · vence dia ${due}</div></div><div class="purchase-value">${money(total)}</div>`;
  document.getElementById('purchasesList').prepend(row);
  document.getElementById('cardForm').style.display='none';
  ['purchaseName','purchaseValue','cardDue'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('purchaseInstallments').value='1';
  updateCredit();
}
function updateCredit(){
  let bill=0;
  document.querySelectorAll('.purchase-row').forEach(r=>bill+=parseFloat(r.dataset.purchaseValue||0));
  const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('creditLimit').textContent=money(creditLimitValue);
  document.getElementById('creditBill').textContent=money(bill);
}

function toggleTxForm(){
  const f=document.getElementById('txForm');
  f.style.display=f.style.display==='block'?'none':'block';
}
function addTransaction(){
  const type=document.getElementById('txType').value;
  const name=document.getElementById('txName').value.trim();
  const category=document.getElementById('txCategory').value;
  const date=document.getElementById('txDate').value;
  const value=parseFloat(document.getElementById('txValue').value||0);
  if(!name||!date||!value){alert('Preencha descrição, data e valor.');return;}
  const d=new Date(date+'T00:00:00');
  const dateText=d.toLocaleDateString('pt-BR');
  const valueText=value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const row=document.createElement('div');
  row.className='tx-row'; row.dataset.txValue=value; row.dataset.txType=type;
  row.innerHTML=`<div class="icon">${type==='in'?'📥':'📤'}</div><div><b>${name}</b><div class="tx-date">${category} · ${dateText}</div></div><div class="tx-value ${type==='in'?'tx-in':'tx-out'}">${type==='in'?'+':'-'} ${valueText}</div>`;
  document.getElementById('transactionsList').prepend(row);
  document.getElementById('txForm').style.display='none';
  ['txName','txDate','txValue'].forEach(id=>document.getElementById(id).value='');
  updateDashboard();
}

function toggleBillForm(){
  const f=document.getElementById('billForm');
  f.style.display=f.style.display==='block'?'none':'block';
}
function toggleBillStatus(btn){
  const row=btn.closest('.bill-row');
  if(btn.classList.contains('bill-pending')){
    btn.classList.remove('bill-pending');btn.classList.add('bill-paid');btn.textContent='Paga';
    row.dataset.billStatus='paid';
  }else{
    btn.classList.remove('bill-paid');btn.classList.add('bill-pending');btn.textContent='Pendente';
    row.dataset.billStatus='pending';
  }
  updateDashboard();
}
function updateDashboard(){
  let pending=0;
  document.querySelectorAll('.bill-row').forEach(row=>{
    const value=parseFloat(row.dataset.billValue||0);
    if(row.dataset.billStatus!=='paid') pending+=value;
  });
  let addedIn=0, addedOut=0;
  document.querySelectorAll('.tx-row').forEach(row=>{
    const value=parseFloat(row.dataset.txValue||0);
    if(row.dataset.txType==='in') addedIn+=value; else addedOut+=value;
  });
  const baseIn=parseFloat(document.getElementById('totalEntradas').dataset.base||5800);
  const baseOut=parseFloat(document.getElementById('totalDespesas').dataset.base||3420);
  const entradas=baseIn+addedIn, despesas=baseOut+addedOut;
  const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('totalEntradas').textContent=money(entradas);
  document.getElementById('totalDespesas').textContent=money(despesas);
  document.getElementById('totalContas').textContent=money(pending);
  document.getElementById('saldoPrevisto').textContent=money(entradas-despesas-pending);
}
document.getElementById('totalEntradas').dataset.base='5800';
document.getElementById('totalDespesas').dataset.base='3420';
function addBill(){
  const name=document.getElementById('billName').value.trim();
  const value=parseFloat(document.getElementById('billValue').value||0);
  const due=document.getElementById('billDue').value;
  const recurring=document.getElementById('billRecurring').value;
  if(!name||!due){alert('Preencha o nome e o dia de vencimento.');return;}
  const valueText=value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const row=document.createElement('div'); row.className='bill-row'; row.dataset.billValue=value; row.dataset.billStatus='pending';
  row.innerHTML=`<div class="icon">🧾</div><div><b>${name}</b><div class="bill-date">Vencimento: dia ${due} · ${recurring==='yes'?'Mensal':'Uma vez'}</div></div><div class="bill-value">${valueText}<br><button class="bill-status bill-pending" onclick="toggleBillStatus(this)">Pendente</button></div>`;
  document.getElementById('billsList').prepend(row);
  updateDashboard();
  document.getElementById('billForm').style.display='none';
  ['billName','billValue','billDue'].forEach(id=>document.getElementById(id).value='');
}

function toggleEventForm(){
  const f=document.getElementById('eventForm');
  f.style.display=f.style.display==='block'?'none':'block';
}
function addEvent(){
  const name=document.getElementById('eventName').value.trim();
  const location=document.getElementById('eventLocation').value.trim();
  const date=document.getElementById('eventDate').value;
  const value=parseFloat(document.getElementById('eventValue').value||0);
  const status=document.getElementById('eventStatus').value;
  if(!name||!location||!date){alert('Preencha nome, local e data.');return;}
  const d=new Date(date+'T00:00:00');
  const dateText=d.toLocaleDateString('pt-BR');
  const valueText=value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const statusClass=status==='paid'?'status-paid':'status-pending';
  const statusText=status==='paid'?'Recebido':'A receber';
  const row=document.createElement('div');
  row.className='event-row';
  row.innerHTML=`<div class="icon">📅</div><div><b>${name}</b><div class="event-date">📍 ${location} · ${dateText}</div></div><div class="event-value">${valueText}<br><button class="status-btn ${statusClass}" onclick="toggleStatus(this)">${statusText}</button></div>`;
  document.getElementById('eventsList').prepend(row);
  document.getElementById('eventForm').style.display='none';
  ['eventName','eventLocation','eventDate','eventValue'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('eventStatus').value='pending';
}
function toggleStatus(btn){
  if(btn.classList.contains('status-pending')){
    btn.classList.remove('status-pending'); btn.classList.add('status-paid'); btn.textContent='Recebido';
  }else{
    btn.classList.remove('status-paid'); btn.classList.add('status-pending'); btn.textContent='A receber';
  }
}

function moneyBR(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function saveData(){
  const data={
    bills:[...document.querySelectorAll('.bill-row')].map(r=>({html:r.outerHTML,value:r.dataset.billValue,status:r.dataset.billStatus})),
    tx:[...document.querySelectorAll('.tx-row')].map(r=>({html:r.outerHTML,value:r.dataset.txValue,type:r.dataset.txType})),
    events:[...document.querySelectorAll('.event-row')].map(r=>r.outerHTML),
    purchases:[...document.querySelectorAll('.purchase-row')].map(r=>({html:r.outerHTML,value:r.dataset.purchaseValue}))
  };
  localStorage.setItem('meuFinanceiroData',JSON.stringify(data));
}
function loadData(){
  try{
    const data=JSON.parse(localStorage.getItem('meuFinanceiroData')||'null'); if(!data)return;
    if(data.bills?.length){document.getElementById('billsList').innerHTML='';data.bills.forEach(x=>{const t=document.createElement('div');t.innerHTML=x.html;const r=t.firstElementChild;r.dataset.billValue=x.value;r.dataset.billStatus=x.status;document.getElementById('billsList').appendChild(r);});}
    if(data.tx?.length){document.getElementById('transactionsList').innerHTML='';data.tx.forEach(x=>{const t=document.createElement('div');t.innerHTML=x.html;const r=t.firstElementChild;r.dataset.txValue=x.value;r.dataset.txType=x.type;document.getElementById('transactionsList').appendChild(r);});}
    if(data.events?.length){document.getElementById('eventsList').innerHTML=data.events.join('');}
    if(data.purchases?.length){document.getElementById('purchasesList').innerHTML='';data.purchases.forEach(x=>{const t=document.createElement('div');t.innerHTML=x.html;const r=t.firstElementChild;r.dataset.purchaseValue=x.value;document.getElementById('purchasesList').appendChild(r);});}
  }catch(e){}
}
function updateReports(){
  const inV=parseFloat(document.getElementById('totalEntradas').textContent.replace(/[^0-9,-]/g,'').replace('.','').replace(',','.'))||0;
  const outV=parseFloat(document.getElementById('totalDespesas').textContent.replace(/[^0-9,-]/g,'').replace('.','').replace(',','.'))||0;
  const bills=parseFloat(document.getElementById('totalContas').textContent.replace(/[^0-9,-]/g,'').replace('.','').replace(',','.'))||0;
  let card=0; document.querySelectorAll('.purchase-row').forEach(r=>card+=parseFloat(r.dataset.purchaseValue||0));
  document.getElementById('reportIn').textContent=moneyBR(inV);
  document.getElementById('reportOut').textContent=moneyBR(outV);
  document.getElementById('reportBills').textContent=moneyBR(bills);
  document.getElementById('reportCard').textContent=moneyBR(card);
  const pct=Math.min(100,(outV/Math.max(inV,1))*100);
  document.getElementById('reportPercent').textContent=Math.round(pct)+'%';
  document.getElementById('reportBar').style.width=pct+'%';
}


const _updateDashboard=updateDashboard;
updateDashboard=function(){_updateDashboard();updateReports();saveData();};
const _updateCredit=updateCredit;
updateCredit=function(){_updateCredit();updateReports();saveData();};
const _toggleBillStatus=toggleBillStatus;
toggleBillStatus=function(btn){_toggleBillStatus(btn);saveData();};
const _toggleStatus=toggleStatus;
toggleStatus=function(btn){_toggleStatus(btn);saveData();updateReports();};

loadData();
updateDashboard();
updateCredit();
updateReports();
saveData();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js");}</script></body>
</html>
